[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "impact-trail"
version = "0.1.0"
description = "Explain the reach of a Python change with local, inspectable import trails."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Impact Trail contributors"}]
keywords = ["git", "python", "code-review", "static-analysis", "change-impact"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
impact-trail = "impact_trail.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
