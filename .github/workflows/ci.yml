name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: impact-trail --root examples/shop --changed shop/pricing.py --format html --output example-report.html
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip wheel --no-deps . -w dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - name: Publish initial alpha if absent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo "v0.1.0 is already published; leaving it unchanged."
          else
            gh release create v0.1.0 dist/*.whl --target "$RELEASE_COMMIT" --title "Impact Trail v0.1.0 Alpha" --notes-file docs/release-notes.md --prerelease
          fi
