name: Incorrect or missing evidence
description: Report a reproducible analysis problem
title: "[evidence] "
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
      description: Include file paths, imports and command. Remove private code and credentials.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual evidence
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Python, Git and Impact Trail versions
